[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "mcp2cli"
version = "0.1.0"
description = "CLI wrapper for calling MCP tools on a policy-proxy endpoint"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
repository = "https://github.com/prog76/mcp_mcp2cli"
dependencies = [
    "mcp>=1.0.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
mcp2cli = "mcp2cli.cli:main"

[project.urls]
Homepage = "https://github.com/prog76/mcp_mcp2cli"
Documentation = "https://github.com/prog76/mcp_mcp2cli#readme"

[tool.hatch.build.targets.wheel]
packages = ["mcp2cli"]

[tool.pytest.ini_options]
testpaths = ["tests"]
